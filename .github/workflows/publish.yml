name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@c24ace1026dd66d9d5ce97d949d9efc5fa9899d1 # main
    with:
      # The published modules (aes.js, enc-hex.js, ...) are generated from
      # src/ by scripts/build.mjs and not committed, so the publish job has to
      # build before it packs. The build has no dependencies; the install only
      # brings commitlint.
      build-for-publish: true
    secrets: inherit
